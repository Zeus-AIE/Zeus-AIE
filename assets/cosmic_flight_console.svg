<svg width="100%" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#070c1d" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screen-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1836" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#040a1c" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-pulse" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern for Radar & Instruments -->
    <pattern id="mfd-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.05" />
      <circle cx="0" cy="0" r="0.6" fill="#00F0FF" fill-opacity="0.15" />
    </pattern>

    <!-- Radar Sweep Animation -->
    <style>
      @keyframes mapSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes mapPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.6); opacity: 0.2; }
      }
      @keyframes scanLineVert {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.5; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes meterFlow {
        0%, 100% { width: 92%; }
        50% { width: 98%; }
      }

      .map-sweep-line { transform-origin: 450px 165px; animation: mapSweep 7s linear infinite; }
      .map-beacon-ring { transform-origin: 450px 190px; animation: mapPulse 2.2s ease-out infinite; }
      .mfd-scanline { animation: scanLineVert 5s ease-in-out infinite; }
      .beacon-dot { animation: blinkBeacon 1.5s ease-in-out infinite; }
      .meter-animated { animation: meterFlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Overall Console Container -->
  <rect width="900" height="330" rx="14" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="330" rx="14" fill="url(#mfd-grid)" />

  <!-- Laser Scanning Line Across Whole Console -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00F0FF" stroke-width="1" opacity="0.4" filter="url(#glow-cyan)" class="mfd-scanline" />

  <!-- ==================== SCREEN 1: OFFICER PERSONNEL DOSSIER ==================== -->
  <g transform="translate(20, 20)">
    <!-- Screen Bezel -->
    <rect width="270" height="290" rx="8" fill="url(#screen-glass)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Screen Header Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 28 L 0 28 Z" fill="#0b1633" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.4" />
    <rect x="12" y="10" width="8" height="8" rx="2" fill="#00F0FF" class="beacon-dot" />
    <text x="26" y="17" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1.5">DOSSIER // PERSONNEL FILE</text>
    <text x="256" y="17" text-anchor="end" font-family="monospace" font-size="9" fill="#64748B">SEC_01</text>

    <!-- Pilot Hologram Avatar Frame -->
    <g transform="translate(15, 42)">
      <rect width="68" height="74" rx="6" fill="#050c20" stroke="#00F0FF" stroke-width="1" stroke-dasharray="24 4" />
      <!-- Pilot Helmet Silhouette -->
      <circle cx="34" cy="30" r="18" fill="#0a1945" stroke="#38BDF8" stroke-width="1" />
      <path d="M 22 28 Q 34 22 46 28 Q 44 40 34 40 Q 24 40 22 28 Z" fill="#00F0FF" fill-opacity="0.8" filter="url(#glow-cyan)" />
      <path d="M 16 64 C 16 48 52 48 52 64 Z" fill="#0e235e" stroke="#38BDF8" stroke-width="0.8" />
      <!-- Hologram HUD Tag -->
      <text x="34" y="68" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#00F0FF" letter-spacing="1">ID: ZEUS</text>
    </g>

    <!-- Name & Rank Details -->
    <g transform="translate(94, 48)">
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">LA THAI HOA</text>
      <text x="0" y="29" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#00F0FF" letter-spacing="1.2">CALLSIGN: ZEUS</text>
      <text x="0" y="44" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.5">AI SYSTEMS ARCHITECT</text>
      <rect x="0" y="52" width="160" height="15" rx="3" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.4" />
      <text x="80" y="63" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#38BDF8" letter-spacing="1">STATUS: MISSION READY</text>
    </g>

    <!-- Divider -->
    <line x1="15" y1="128" x2="255" y2="128" stroke="#1e293b" stroke-width="1" />
    <line x1="15" y1="128" x2="65" y2="128" stroke="#00F0FF" stroke-width="1" filter="url(#glow-cyan)" />

    <!-- Detailed Dossier Parameters -->
    <g transform="translate(15, 142)">
      <!-- Item 1: Academic Base -->
      <text x="0" y="10" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1">ACADEMIC BASE:</text>
      <text x="0" y="23" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Can Tho University (CTU)</text>
      <text x="0" y="36" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#38BDF8">B.S. in Computer Science • GPA 3.37</text>

      <!-- Item 2: Core Domain -->
      <text x="0" y="57" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1">CORE FRONTIERS:</text>
      <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Multimodal AI &amp; Foundation Models</text>
      <text x="0" y="83" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#00F0FF">Vision-Language, Agents &amp; RLHF</text>

      <!-- Item 3: Systems -->
      <text x="0" y="104" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1">ENGINEERING:</text>
      <text x="0" y="117" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">Low-Latency Win32 C-APIs • Python • React 18</text>
      <text x="0" y="130" font-family="'Space Grotesk', monospace" font-size="9" fill="#10B981">DEPLOYMENT: HIREABLE [OPEN FOR ROLES]</text>
    </g>
  </g>

  <!-- ==================== SCREEN 2: SECTOR STAR MAP & NAVIGATION ==================== -->
  <g transform="translate(305, 20)">
    <!-- Screen Bezel -->
    <rect width="290" height="290" rx="8" fill="url(#screen-glass)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Screen Header Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 282 0 Q 290 0 290 8 L 290 28 L 0 28 Z" fill="#0b1633" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.4" />
    <rect x="12" y="10" width="8" height="8" rx="2" fill="#38BDF8" class="beacon-dot" />
    <text x="26" y="17" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1.5">NAVIGATION // SECTOR STAR MAP</text>
    <text x="278" y="17" text-anchor="end" font-family="monospace" font-size="9" fill="#64748B">SEC_02</text>

    <!-- Star Map Grid & Radar Rings -->
    <g transform="translate(145, 145)">
      <!-- Range Circles -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="2 3" />

      <!-- Coordinate Crosshairs -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 4" />
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 4" />

      <!-- Degree Angle Markers -->
      <text x="0" y="-103" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748B">000°</text>
      <text x="106" y="3" text-anchor="start" font-family="monospace" font-size="8" fill="#64748B">090°</text>
      <text x="0" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748B">180°</text>
      <text x="-106" y="3" text-anchor="end" font-family="monospace" font-size="8" fill="#64748B">270°</text>

      <!-- Constellation Hyperlanes (Star Routes) -->
      <line x1="-45" y1="-30" x2="30" y2="-50" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <line x1="30" y1="-50" x2="60" y2="20" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <line x1="60" y1="20" x2="0" y2="45" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" />
      <line x1="0" y1="45" x2="-55" y2="25" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 3" />

      <!-- Star Nodes -->
      <circle cx="-45" cy="-30" r="2.5" fill="#ffffff" />
      <circle cx="30" cy="-50" r="3" fill="#38BDF8" filter="url(#glow-cyan)" />
      <circle cx="60" cy="20" r="2.5" fill="#818CF8" />
      <circle cx="-55" cy="25" r="2" fill="#ffffff" />

      <!-- Sweeping Radar Sector Line -->
      <line x1="0" y1="0" x2="80" y2="-60" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow-cyan)" class="map-sweep-line" />

      <!-- Primary Target: Can Tho Station Beacon -->
      <g transform="translate(0, 45)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#00F0FF" stroke-width="1" class="map-beacon-ring" />
        <circle cx="0" cy="0" r="6" fill="#00F0FF" filter="url(#glow-pulse)" />
        <circle cx="0" cy="0" r="2" fill="#ffffff" />
      </g>
    </g>

    <!-- Map Lower Telemetry Bar -->
    <g transform="translate(15, 252)">
      <rect width="260" height="26" rx="4" fill="#070e24" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="17" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#00F0FF" letter-spacing="1">COORD: 10.0452°N, 105.7469°E</text>
      <text x="250" y="17" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="9" fill="#38BDF8">CAN THO // VIETNAM</text>
    </g>
  </g>

  <!-- ==================== SCREEN 3: AVIONICS COMMS & TELEMETRY ==================== -->
  <g transform="translate(610, 20)">
    <!-- Screen Bezel -->
    <rect width="270" height="290" rx="8" fill="url(#screen-glass)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Screen Header Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 28 L 0 28 Z" fill="#0b1633" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.4" />
    <rect x="12" y="10" width="8" height="8" rx="2" fill="#818CF8" class="beacon-dot" />
    <text x="26" y="17" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#818CF8" letter-spacing="1.5">AVIONICS // COMMUNICATIONS</text>
    <text x="256" y="17" text-anchor="end" font-family="monospace" font-size="9" fill="#64748B">SEC_03</text>

    <!-- Comms Channel 1: Email Transmission -->
    <g transform="translate(15, 42)">
      <rect width="240" height="42" rx="5" fill="#070f26" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#0e1f4d" stroke="#38BDF8" stroke-width="0.8" />
      <!-- Small Mail Icon -->
      <path d="M 14 17 L 20 21 L 26 17 M 14 17 L 14 25 L 26 25 L 26 17 Z" stroke="#00F0FF" stroke-width="0.8" fill="none" />
      <text x="36" y="17" font-family="'Space Grotesk', monospace" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">QUANTUM COMMS (PRIMARY):</text>
      <text x="36" y="31" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#00F0FF">lathaihoa2003@gmail.com</text>
    </g>

    <!-- Comms Channel 2: Subspace Audio Link -->
    <g transform="translate(15, 92)">
      <rect width="240" height="42" rx="5" fill="#070f26" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#0e1f4d" stroke="#38BDF8" stroke-width="0.8" />
      <!-- Signal Tower Icon -->
      <path d="M 20 15 L 20 27 M 16 19 Q 20 16 24 19 M 14 22 Q 20 18 26 22" stroke="#38BDF8" stroke-width="0.8" fill="none" />
      <text x="36" y="17" font-family="'Space Grotesk', monospace" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">SUBSPACE VOICE LINK:</text>
      <text x="36" y="31" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#38BDF8">(+84) 0865 254 028</text>
    </g>

    <!-- Avionics System Telemetry Meters -->
    <g transform="translate(15, 148)">
      <text x="0" y="10" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="1">TELEMETRY DIAGNOSTICS:</text>

      <!-- Gauge 1: AI Model Power -->
      <text x="0" y="26" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#64748B">NEURAL CORE ENGINE</text>
      <text x="240" y="26" text-anchor="end" font-family="monospace" font-size="8.5" fill="#00F0FF">98.4%</text>
      <rect x="0" y="31" width="240" height="6" rx="3" fill="#0f172a" />
      <rect x="0" y="31" width="236" height="6" rx="3" fill="#00F0FF" filter="url(#glow-cyan)" />

      <!-- Gauge 2: RLHF Alignment -->
      <text x="0" y="52" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#64748B">RLHF ALIGNMENT INTEGRITY</text>
      <text x="240" y="52" text-anchor="end" font-family="monospace" font-size="8.5" fill="#10B981">100%</text>
      <rect x="0" y="57" width="240" height="6" rx="3" fill="#0f172a" />
      <rect x="0" y="57" width="240" height="6" rx="3" fill="#10B981" />

      <!-- Gauge 3: System Telemetry -->
      <text x="0" y="78" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#64748B">C-API WIN32 OVERHEAD</text>
      <text x="240" y="78" text-anchor="end" font-family="monospace" font-size="8.5" fill="#38BDF8">&lt; 0.5% CPU</text>
      <rect x="0" y="83" width="240" height="6" rx="3" fill="#0f172a" />
      <rect x="0" y="83" width="18" height="6" rx="3" fill="#38BDF8" />

      <!-- Accreditation Footer Pill -->
      <rect x="0" y="104" width="240" height="26" rx="4" fill="#070e24" stroke="#1e293b" stroke-width="1" />
      <text x="120" y="121" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="700" fill="#818CF8" letter-spacing="1">ACCREDITED: GOOGLE CYBERSECURITY • UX</text>
    </g>
  </g>
</svg>