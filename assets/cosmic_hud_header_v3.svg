<svg width="100%" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#070c1d" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Text and Rings -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hud-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.06" />
      <circle cx="0" cy="0" r="0.8" fill="#00F0FF" fill-opacity="0.2" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes rotateClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes scanLaser {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .radar-center { transform-origin: 755px 140px; }
      .orbit-1 { transform-origin: 755px 140px; animation: rotateClockwise 20s linear infinite; }
      .orbit-2 { transform-origin: 755px 140px; animation: rotateCounter 30s linear infinite; }
      .orbit-3 { transform-origin: 755px 140px; animation: rotateClockwise 10s linear infinite; }
      .radar-line { transform-origin: 755px 140px; animation: radarSweep 6s linear infinite; }
      .laser-scanner { animation: scanLaser 4.5s ease-in-out infinite; }
      .beacon { animation: pulseGlow 1.8s ease-in-out infinite; }
      .star-1 { animation: starTwinkle 2.5s ease-in-out infinite; }
      .star-2 { animation: starTwinkle 3.8s ease-in-out infinite 0.8s; }
      .star-3 { animation: starTwinkle 1.9s ease-in-out infinite 1.4s; }
      .star-4 { animation: starTwinkle 4.2s ease-in-out infinite 2.1s; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="280" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="280" rx="14" fill="url(#hud-grid)" />

  <!-- Scanning Laser Line -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00F0FF" stroke-width="1.2" opacity="0.5" filter="url(#glow-cyan)" class="laser-scanner" />

  <!-- Starfield (Distant Cosmos) -->
  <g fill="#ffffff">
    <circle cx="45" cy="35" r="1" class="star-1" />
    <circle cx="120" cy="80" r="1.2" class="star-2" />
    <circle cx="240" cy="40" r="0.8" class="star-3" />
    <circle cx="380" cy="95" r="1.4" class="star-4" fill="#38BDF8" />
    <circle cx="520" cy="30" r="1" class="star-1" />
    <circle cx="630" cy="65" r="1.5" class="star-2" fill="#00F0FF" />
    <circle cx="180" cy="220" r="1" class="star-3" />
    <circle cx="310" cy="245" r="1.2" class="star-4" />
    <circle cx="490" cy="210" r="0.8" class="star-1" />
    <circle cx="620" cy="235" r="1.3" class="star-2" />
    <circle cx="80" cy="160" r="1" class="star-3" />
    <circle cx="870" cy="45" r="1" class="star-1" />
    <circle cx="850" cy="250" r="1.2" class="star-2" fill="#818CF8" />
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 880 40 L 880 20 L 860 20" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 20 240 L 20 260 L 40 260" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 880 240 L 880 260 L 860 260" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Left Header Status Indicators -->
  <g transform="translate(35, 38)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#00F0FF" class="beacon" />
    <text x="16" y="8" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="2">SYSTEM_TELEMETRY: ONLINE // ORBIT: CAN THO, VN</text>
  </g>

  <!-- Main Identity Content -->
  <g transform="translate(35, 78)">
    <!-- Mission Tracker Tag -->
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.35" />
    <text x="10" y="15" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1.5">ZEUS COMMAND // AI CORE</text>

    <!-- Name Heading with automatic tspan flow to prevent any overlap -->
    <text x="0" y="58" font-family="'Space Grotesk', -apple-system, sans-serif">
      <tspan font-size="34" font-weight="800" fill="url(#text-grad)" letter-spacing="1.5" filter="url(#glow-cyan)">LA THAI HOA</tspan>
      <tspan font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="2"> (ZEUS)</tspan>
    </text>

    <!-- Technical Roles -->
    <text x="0" y="92" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">
      AI ENGINEER • MULTIMODAL DEEP LEARNING • SYSTEMS ARCHITECTURE
    </text>

    <!-- Mission Subtext -->
    <text x="0" y="116" font-family="'Space Grotesk', monospace" font-size="12" font-weight="400" fill="#64748B" letter-spacing="0.5">
      Advancing Multimodal AI, Foundation Architectures &amp; High-Performance Edge Systems
    </text>

    <!-- Interactive Data Metric Badges -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="168" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" font-family="monospace" font-size="10.5" fill="#38BDF8">MULTIMODAL AI &amp; LLMs</text>

      <rect x="180" y="0" width="180" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="192" y="17" font-family="monospace" font-size="10.5" fill="#00F0FF">AI SAFETY &amp; ALIGNMENT</text>

      <rect x="372" y="0" width="175" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="384" y="17" font-family="monospace" font-size="10.5" fill="#818CF8">SCALABLE EDGE SYSTEMS</text>
    </g>
  </g>

  <!-- Right Side: Holographic Planetary Radar & Celestial Telemetry -->
  <g class="radar-center">
    <!-- Planetary Core with Atmospheric Glow -->
    <circle cx="755" cy="140" r="38" fill="#050d26" stroke="#00F0FF" stroke-width="1.8" filter="url(#glow-blue)" />
    <circle cx="755" cy="140" r="28" fill="#0a1845" />
    <circle cx="745" cy="130" r="14" fill="#00F0FF" fill-opacity="0.18" />

    <!-- Orbital Rings (Rotating dynamically in reverse directions) -->
    <!-- Orbit 1: Wide Planetary Ellipse -->
    <ellipse cx="755" cy="140" rx="95" ry="42" fill="none" stroke="url(#ring-grad)" stroke-width="1.8" stroke-dasharray="12 6 3 6" class="orbit-1" filter="url(#glow-cyan)" />
    
    <!-- Orbit 2: Outer Circular Radar with Distance Markers -->
    <circle cx="755" cy="140" r="105" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="755" cy="140" r="105" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="30 90 20 40" stroke-opacity="0.6" class="orbit-2" />

    <!-- Orbit 3: Inner Orbital Node with Starship Drone Satellite -->
    <g class="orbit-3">
      <circle cx="755" cy="84" r="4" fill="#00F0FF" filter="url(#glow-cyan)" />
      <line x1="755" y1="84" x2="755" y2="140" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
    </g>

    <!-- Radar Crosshair & Sweeping Beam -->
    <line x1="635" y1="140" x2="875" y2="140" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="755" y1="20" x2="755" y2="260" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Sweeping Radar Sector Line -->
    <line x1="755" y1="140" x2="855" y2="60" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.75" class="radar-line" filter="url(#glow-cyan)" />

    <!-- Reticle Telemetry Labels -->
    <text x="755" y="258" text-anchor="middle" font-family="monospace" font-size="9" fill="#00F0FF" letter-spacing="1.5" opacity="0.85">ORBIT_RADAR // 360° TELEMETRY</text>
  </g>
</svg>